version: '3.9'

services:
  db:
    image: postgres:17-alpine
    container_name: postgresdb
    environment:
      POSTGRES_DB: empresa
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@correo.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - backend
    restart: unless-stopped

  app:
    build: .
    image: ghcr.io/ljbtorres-debug/holataller:latest
    container_name: flaskapp
    ports:
      - "5001:5001"
    environment:
      - APP_NAME=Sistema de Productos DevOps
      - APP_VERSION=1.0.0
      - DB_HOST=db
      - DB_NAME=empresa
      - DB_USER=admin
      - DB_PASSWORD=admin123
    depends_on:
      - db
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge